<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Tactics — Sprite Rig Viewer</title>
<style>
:root{--bg:#121520;--card:#1a1f2d;--line:#2a3142;--text:#e8ecf4;--muted:#8a93a8;--accent:#ffd84d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0 12px 0 0}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}
button{background:#252c3d;color:var(--text);border:1px solid #343c52;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{background:#2f3850}
button.skill{border-color:#6b5a1d;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card svg{width:100%;height:auto;display:block}
.name{font-size:15px;font-weight:600}
.role{font-size:12px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.pv{fill:#ff3bd4;stroke:#fff;stroke-width:1;display:none}
.showpv .pv{display:inline}
.laserdash{stroke-dasharray:7 5;animation:las .5s linear infinite}
@keyframes las{to{stroke-dashoffset:-12}}
.tm{display:none}svg[data-team='0'] .tm0,svg[data-team='1'] .tm1,svg[data-team='2'] .tm2,svg[data-team='3'] .tm3{display:inline}
.now{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
</style>
</head>
<body>
<header>
  <h1>Wild Tactics · Sprite rig</h1>
  <div class="ctl">Team <span id="swatches" style="display:flex;gap:6px"></span></div>
  <div class="ctl">Speed <input id="speed" type="range" min="0.1" max="1.5" step="0.05" value="1"><span id="speedv">1.0x</span></div>
  <label class="ctl"><input id="pv" type="checkbox"> Show pivots</label>
  <button id="allSkill" class="skill">Play all skills</button>
</header>
<div class="grid" id="grid"></div>

<script>
/* ============================================================
   RIG FORMAT
   part: { id, parent?, pivot:[x,y] (absolute coords), svg (absolute coords), d?:{defaults} }
   Each part becomes <g transform="translate(rel+x,y) rotate(r) scale(sx,sy)" opacity=o>
   Children inherit parent transform (hierarchy = bones).
   clip: { dur(ms), loop?, hold?(ms), tracks:{ partId:[[t0..1,{x,y,r,sx,sy,o,e}],...] } }
   e = easing into that key: 'io'(default) | 'in' | 'out' | 'lin'
   ============================================================ */
const T = 'fill:var(--team)';
const TS = 'stroke:var(--team)';
const SH = 'fill="#000" fill-opacity=".22"';

   0 cap · 1 beanie · 2 ranger hat · 3 top hat  (base center x,y; scale k) */

<g class="tm tm0"><path d="M-14,0 C-14,-19 14,-19 14,0Z" style="${T}"/><path d="M2,-17 C9,-15 14,-9 14,0 L4,0Z" ${SH}/><path d="M9,-4 L27,-1 L9,2Z" style="${T}"/><path d="M9,-1 L27,-1 L9,2Z" ${SH}/><circle cx="0" cy="-17" r="2.2" style="${T}"/></g>
<g class="tm tm1"><path d="M-14,0 C-14,-21 14,-21 14,0Z" style="${T}"/><path d="M3,-19 C10,-16 14,-9 14,0 L5,0Z" ${SH}/><rect x="-15.5" y="-5" width="31" height="7" rx="3.5" style="${T}"/><rect x="-15.5" y="-1" width="31" height="3" rx="1.5" ${SH}/><circle cx="0" cy="-22" r="5.5" fill="#fff"/><circle cx="1.5" cy="-21" r="3.5" fill="#000" fill-opacity=".12"/></g>
<g class="tm tm2"><path d="M-17,1 L17,1 C10,-4 4,-10 -2,-28 C-8,-14 -12,-6 -17,1Z" style="${T}"/><path d="M-2,-28 C4,-10 10,-4 17,1 L4,1Z" ${SH}/><path d="M-5,-4 C-14,-18 -22,-24 -28,-30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M-12,-14 L-17,-12 M-18,-20 L-23,-18" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></g>
<g class="tm tm3"><rect x="-11" y="-26" width="22" height="25" rx="2" style="${T}"/><rect x="2" y="-26" width="9" height="25" rx="2" ${SH}/><rect x="-11" y="-9" width="22" height="4" fill="#1a1a22" fill-opacity=".55"/><rect x="-18" y="-3" width="36" height="5" rx="2.5" style="${T}"/><rect x="0" y="-3" width="18" height="5" rx="2.5" ${SH}/></g>
${boss?`<polygon points="-6,-6 -6,-12 -3,-9 0,-14 3,-9 6,-12 6,-6" fill="#ffd84d" stroke="#b8860b" stroke-width=".8"/>`:''}
</g>`;

 root:[[0,{}],[.15,{sx:1.1,sy:.9}],[.35,{y:-20,sx:.95,sy:1.06,e:'out'}],[.55,{y:-20}],[.72,{sx:1.1,sy:.9,e:'in'}],[.85,{}],[1,{}]],
 earF:[[0,{}],[.35,{r:22}],[.45,{r:-15}],[.55,{r:15}],[.7,{}],[1,{}]],
 earB:[[0,{}],[.38,{r:-15}],[.48,{r:15}],[.7,{}],[1,{}]],
 head:[[0,{}],[.35,{r:-8}],[.55,{r:6}],[.8,{}],[1,{}]],
 tail:[[0,{}],[.35,{r:25}],[.6,{r:-10}],[1,{}]],
 ping1:[[0,{sx:.2,sy:.2}],[.4,{o:1,sx:.3,sy:.3}],[.9,{o:0,sx:2.3,sy:2.3,e:'out'}],[1,{}]],

/* generic clips shared by all units (target root/body/head) */
const GENERIC = {
 idle:{dur:1600,loop:true,tracks:{body:[[0,{}],[.5,{sy:1.03,sx:.985}],[1,{}]],head:[[0,{}],[.5,{y:-1.5}],[1,{}]]}},
 move:{dur:650,tracks:{hat:[[0,{}],[.5,{y:3}],[.82,{y:-4,r:-6}],[1,{}]],root:[[0,{}],[.15,{sx:1.12,sy:.88}],[.5,{y:-24,sx:.94,sy:1.08,e:'out'}],[.82,{sx:1.14,sy:.86,e:'in'}],[1,{}]]}},
 hit:{dur:520,tracks:{hat:[[0,{}],[.12,{y:-6,r:-14,e:'out'}],[.4,{}],[1,{}]],root:[[0,{}],[.12,{x:-10,r:-7,o:.45,e:'out'}],[.25,{x:-6}],[.38,{x:-8,o:.45}],[.5,{x:-4}],[1,{}]],head:[[0,{}],[.12,{r:-10}],[1,{}]]}},
 ko:{dur:1000,hold:900,tracks:{root:[[0,{}],[.2,{y:-10,r:-10}],[.6,{r:80,x:10,sy:.9,e:'in'}],[.75,{r:74,x:12}],[1,{r:80,x:12,o:0}]]}},
};

/* ================= engine ================= */
const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const EASE={lin:t=>t,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const BASE={x:0,y:0,r:0,sx:1,sy:1,o:1};
let SPEED=1;

function sample(keys,p,def){
  const full=k=>Object.assign({},def,k[1]);
  if(p<=keys[0][0])return full(keys[0]);
  for(let i=1;i<keys.length;i++){
    if(p<=keys[i][0]){
      const a=full(keys[i-1]),b=full(keys[i]);
      const span=keys[i][0]-keys[i-1][0]||1;
      const t=EASE[keys[i][1].e||'io']((p-keys[i-1][0])/span);
      const o={};for(const k in BASE)o[k]=a[k]+(b[k]-a[k])*t;return o;
    }
  }
  return full(keys[keys.length-1]);
}

class Rig{
  constructor(def,svg){
    this.def=def;this.nodes={};
    this.shadow=mk('ellipse',{cx:0,cy:0,rx:34,ry:8,fill:'#000',opacity:.3});
    svg.appendChild(this.shadow);
    const layer=mk('g');svg.appendChild(layer);
    for(const p of def.parts){
      const outer=mk('g'),inner=mk('g',{transform:`translate(${-p.pivot[0]},${-p.pivot[1]})`});
      inner.innerHTML=p.svg||'';outer.appendChild(inner);
      const par=p.parent?this.nodes[p.parent]:null;
      (par?par.outer:layer).appendChild(outer);
      outer.appendChild(mk('circle',{r:3,class:'pv'}));
      const rel=par?[p.pivot[0]-par.p.pivot[0],p.pivot[1]-par.p.pivot[1]]:p.pivot;
      this.nodes[p.id]={p,outer,rel,def:Object.assign({},BASE,p.d)};
    }
    this.clips={
      idle:{...GENERIC.idle,tracks:{...GENERIC.idle.tracks,...(def.idle||{})}},
      move:GENERIC.move,hit:GENERIC.hit,ko:GENERIC.ko,skill:def.skill};
    this.play('idle');
  }
  play(name){this.cur=name;this.clip=this.clips[name];this.el=0;this.onchange&&this.onchange(name)}
  tick(dt){
    const c=this.clip;this.el+=dt*SPEED;
    let p=this.el/c.dur;
    if(c.loop)p%=1;
    else if(p>=1){p=1;if(this.el>=c.dur+(c.hold||150)){this.play('idle');return this.tick(0)}}
    for(const id in this.nodes){
      const n=this.nodes[id],tr=c.tracks[id];
      const s=tr?sample(tr,p,n.def):n.def;
      n.outer.setAttribute('transform',`translate(${(n.rel[0]+s.x).toFixed(2)},${(n.rel[1]+s.y).toFixed(2)}) rotate(${s.r.toFixed(2)}) scale(${s.sx.toFixed(3)},${s.sy.toFixed(3)})`);
      n.outer.setAttribute('opacity',s.o.toFixed(3));
      if(id==='root'){
        const k=Math.max(.45,1+s.y/50);
        this.shadow.setAttribute('transform',`translate(${s.x.toFixed(2)},0) scale(${k.toFixed(3)})`);
        this.shadow.setAttribute('opacity',(.3*s.o*k).toFixed(3));
      }
    }
  }
}

/* ================= UI ================= */
const TEAMS=['#ff5a5a','#4da3ff','#5ad17a','#ffcc33'];
const grid=document.getElementById('grid');
const rigs=[];
function tile(){
  const g=mk('g');
  g.innerHTML=`<polygon points="-70,0 0,30 0,44 -70,14" fill="#2a3142"/><polygon points="70,0 0,30 0,44 70,14" fill="#20263a"/><polygon points="-70,0 0,-30 70,0 0,30" fill="#3d4760"/><polygon points="-70,0 0,-30 0,-27 -64,0" fill="#4a5672"/>`;
  return g;
}
for(const key in UNITS){
  const d=UNITS[key];
  const card=document.createElement('div');card.className='card';
  const svg=mk('svg',{viewBox:'-130 -140 260 200'});svg.style.setProperty('--team',TEAMS[0]);svg.setAttribute('data-team','0');
  svg.appendChild(tile());
  const rig=new Rig(d,svg);rigs.push({rig,svg});
  const info=document.createElement('div');
  info.innerHTML=`<div class="name">${d.name}</div><div class="role">${d.role}</div>`;
  const now=document.createElement('div');now.className='now';
  rig.onchange=n=>now.textContent='clip: '+n;now.textContent='clip: idle';
  const btns=document.createElement('div');btns.className='btns';
  for(const [clip,label] of [['idle','Idle'],['move','Move'],['skill',d.skillName],['hit','Hit'],['ko','KO']]){
    const b=document.createElement('button');b.textContent=label;if(clip==='skill')b.className='skill';
    b.onclick=()=>rig.play(clip);btns.appendChild(b);
  }
  card.append(svg,info,btns,now);grid.appendChild(card);
}
const sw=document.getElementById('swatches');
TEAMS.forEach((c,i)=>{const s=document.createElement('div');s.className='sw'+(i?'':' on');s.style.background=c;
  s.onclick=()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));s.classList.add('on');rigs.forEach(r=>{r.svg.style.setProperty('--team',c);r.svg.setAttribute('data-team',i)})};sw.appendChild(s)});
const sp=document.getElementById('speed'),spv=document.getElementById('speedv');
sp.oninput=()=>{SPEED=+sp.value;spv.textContent=SPEED.toFixed(2)+'x'};
document.getElementById('pv').onchange=e=>document.body.classList.toggle('showpv',e.target.checked);
document.getElementById('allSkill').onclick=()=>rigs.forEach(r=>r.rig.play('skill'));
let last=performance.now();
(function loop(t){const dt=Math.min(50,t-last);last=t;rigs.forEach(r=>r.rig.tick(dt));requestAnimationFrame(loop)})(last);
</script>
